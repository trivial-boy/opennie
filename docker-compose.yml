version: "3.8"

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: accounting_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "opennie@123"
      MYSQL_DATABASE: accounting_db
      MYSQL_USER: user
      MYSQL_PASSWORD: "opennie@123"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - accounting_network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: accounting_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - accounting_network
    command: redis-server /usr/local/etc/redis/redis.conf

  # 记账应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    env_file:
      - ./docker/.env.docker
    depends_on:
      - mysql
      - redis
    networks:
      - accounting_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # 延长启动时间等待依赖安装

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  accounting_network:
    driver: bridge
