version: "3.8"

services:
  # 记账应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend:./
    env_file:
      - ./docker/.env.docker
    networks:
      - accounting_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # 延长启动时间等待依赖安装

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  accounting_network:
    driver: bridge
