# Redis配置文件 - Docker部署

# 网络配置
bind 0.0.0.0
port 6379

# 认证
requirepass "opennie@123"

# 持久化配置
save 900 1
save 300 10
save 60 10000

# AOF持久化
appendonly yes
appendfsync everysec

# 内存管理
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice

# 安全配置
protected-mode yes

# 数据库配置
databases 16

# 客户端连接
timeout 300
tcp-keepalive 300
tcp-backlog 511

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""

# 时区
timezone Asia/Shanghai
